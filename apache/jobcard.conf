<VirtualHost *:443>
    ServerName localhost
    SSLEngine on
    SSLCertificateFile    /etc/apache2/ssl/cert.pem
    SSLCertificateKeyFile /etc/apache2/ssl/key.pem

    # Frontend — serve built files
    DocumentRoot /home/animex/JobCardSystem/frontend/dist

    <Directory /home/animex/JobCardSystem/frontend/dist>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    # Backend API — proxy to Node.js
    ProxyPass /api/v1/ http://localhost:5000/api/v1/
    ProxyPassReverse /api/v1/ http://localhost:5000/api/v1/

    # WebSocket support for Vite HMR (only needed in dev)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) ws://localhost:5173/$1 [P,L]

    # Headers
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY

</VirtualHost>

<VirtualHost *:80>
    ServerName localhost
    Redirect permanent / https://localhost/
</VirtualHost>
