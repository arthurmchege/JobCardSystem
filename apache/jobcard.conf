<VirtualHost *:443>
    ServerName localhost
    SSLEngine on
    SSLCertificateFile    /etc/apache2/ssl/cert.pem
    SSLCertificateKeyFile /etc/apache2/ssl/key.pem
    DocumentRoot /home/arthur/Projects/JobCardSystem/frontend/dist
    <Directory /home/arthur/Projects/JobCardSystem/frontend/dist>
        Options -Indexes
        AllowOverride All
        Require all granted
        FallbackResource /index.html
    </Directory>
    ProxyPass /api/v1/ http://localhost:5000/api/v1/
    ProxyPassReverse /api/v1/ http://localhost:5000/api/v1/
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
</VirtualHost>
<VirtualHost *:80>
    ServerName localhost
    Redirect permanent / https://localhost/
</VirtualHost>
